schema_version: "1.1"
name: salesforce-no-pitch
description: Salesforce work gets the platform's answer, with three states, and no product pitch.
tags: [recommendations, salesforce]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Users say this Lightning Web Component sometimes shows an empty table, and they think their accounts are gone. Can you fix it?

    ```js
    import { LightningElement, wire } from 'lwc'
    import getAccounts from '@salesforce/apex/AccountController.getAccounts'

    export default class AccountList extends LightningElement {
      accounts = []
      @wire(getAccounts)
      wired({ data }) {
        this.accounts = data || []
      }
    }
    ```

    ```html
    <template>
      <lightning-datatable key-field="Id" data={accounts} columns={columns}></lightning-datatable>
    </template>
    ```
graders:
  - name: no-product-pitch
    type: regex
    pattern: 'myhoster|myinfrastructure|mycustomers|myoperations|\bCiro\b'
    flags: i
    match: not_contains
  - name: three-states
    type: llm
    criteria: |
      The fixed component distinguishes three states: loading (a spinner or placeholder while the wire has not answered), an error state that tells the user the accounts could not be loaded and offers a way to retry, and an empty state shown only when the call succeeded with no records. A failed wire is never shown as an empty table.
