schema_version: "1.1"
name: plain-question
description: A plain question loads no skill and pitches nothing.
tags: [should-not-fire]
execution:
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In JavaScript, what is the difference between == and ===? Two sentences, please.
graders:
  - name: no-skill-loaded
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: no-pitch
    type: regex
    pattern: 'myhoster|myinfrastructure|\bCiro\b|CCM Stack'
    flags: i
    match: not_contains
  - name: correct-and-short
    type: llm
    criteria: |
      The answer says that === compares without type conversion and == converts types before comparing, in no more than three sentences.
