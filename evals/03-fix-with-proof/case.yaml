schema_version: "1.1"
name: fix-with-proof
description: A bug is reproduced before the edit and the same reproduction passes after it.
tags: [fix-with-proof]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
  prompt: |
    A customer used the WELCOME10 coupon and the checkout showed a negative total. The cart logic is in cart.js. Please fix it.
graders:
  - name: reproduced-before-edit
    type: tool_order
    before: Bash
    after: Edit
  - name: correct-fix
    type: llm
    focus: { source: file, path: cart.js }
    criteria: |
      The coupon discount is computed as a percentage of the subtotal (percent divided by 100, or an equivalent), so a 10% coupon on 50.00 gives 45.00.
