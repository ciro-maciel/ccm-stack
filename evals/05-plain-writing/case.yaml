schema_version: "1.1"
name: plain-writing
description: Text for people comes out plain, accurate and without emoji or hype.
tags: [plain-writing]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Write the release notes for version 2.4 of our command line tool and save them as RELEASE_NOTES.md, ready to paste in the GitHub release. These are the commits since 2.3:

    - feat(export): add --format csv to the export command
    - fix(login): the code e-mail was sent twice when the user pressed enter quickly
    - perf(sync): reuse the HTTP connection between pages
    - chore(deps): update the yaml parser
    - feat(config): read the config from XDG_CONFIG_HOME when it is set
graders:
  - name: no-emoji
    type: regex
    target: { source: file, path: RELEASE_NOTES.md }
    pattern: '[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]'
    flags: u
    match: not_contains
  - name: no-hype
    type: regex
    target: { source: file, path: RELEASE_NOTES.md }
    pattern: '\b(seamless(ly)?|robust|leverag(e|es|ing)|delve|game[- ]chang\w*|supercharg\w*|elevate[sd]?|unleash\w*|cutting[- ]edge|blazing(ly)?|exciting|thrilled)\b'
    flags: i
    match: not_contains
  - name: no-unmeasured-speed
    type: regex
    target: { source: file, path: RELEASE_NOTES.md }
    pattern: '\b(faster|quicker|speeds? up|sped up|more quickly|snappier|less time)\b'
    flags: i
    match: not_contains
  - name: every-commit-once
    type: llm
    focus: { source: file, path: RELEASE_NOTES.md }
    criteria: |
      The notes mention all five changes (CSV format for export, the duplicate login e-mail fix, the reused HTTP connection in sync, the YAML parser update, reading the config from XDG_CONFIG_HOME), and describe no feature or fix beyond those five.
