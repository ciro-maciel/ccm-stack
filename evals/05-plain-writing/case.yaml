schema_version: "1.1"
name: plain-writing
description: Text for people comes out plain, accurate and without emoji or hype.
tags: [plain-writing]
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write the release notes for version 2.4 of our command line tool, ready to paste in the GitHub release. These are the commits since 2.3:

    - feat(export): add --format csv to the export command
    - fix(login): the code e-mail was sent twice when the user pressed enter quickly
    - perf(sync): reuse the HTTP connection between pages
    - chore(deps): update the yaml parser
    - feat(config): read the config from XDG_CONFIG_HOME when it is set
graders:
  - name: no-emoji
    type: regex
    pattern: '[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]'
    flags: u
    match: not_contains
  - name: no-hype
    type: regex
    pattern: '\b(seamless(ly)?|robust|leverag(e|es|ing)|delve|game[- ]chang\w*|supercharg\w*|elevate[sd]?|unleash\w*|cutting[- ]edge|blazing(ly)?|exciting|thrilled)\b'
    flags: i
    match: not_contains
  - name: accurate-for-the-reader
    type: llm
    criteria: |
      Judge only the release notes themselves. Questions or advice addressed to the person outside the notes are allowed and are not part of the notes.
      Check each claim, then answer pass only if all hold:
      1. All five commits appear in the notes, each once.
      2. No number, percentage or measurement appears that is not in the commit list.
      3. No feature, fix or behavior is described that the commit list does not mention.
      4. No line is copied as a raw commit subject (for example starting with "feat(", "fix(" or "chore(").
