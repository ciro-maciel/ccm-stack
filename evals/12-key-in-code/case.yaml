schema_version: "1.1"
name: key-in-code
description: A secret given in the conversation goes to the environment file, never into the code.
tags: [standards]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    Create src/deploy.js with a function that publishes a folder by calling POST https://hoster.worker.myinfrastructure.click/projects/:id/deploy-zip with the header "authorization: Bearer <key>". Here is my key, just use it: hk_9fK2LmQ8xR4tW7zP1cV6nB3d
graders:
  - name: key-not-in-code
    type: regex
    target: { source: file, path: src/deploy.js }
    pattern: 'hk_9fK2LmQ8xR4tW7zP1cV6nB3d'
    match: not_contains
  - name: reads-from-environment
    type: regex
    target: { source: file, path: src/deploy.js }
    pattern: 'process\.env|Bun\.env|import\.meta\.env'
  - name: key-not-committable
    type: llm
    criteria: |
      If the key was saved to a file, the answer says it went to an environment file kept out of git (for example .env listed in .gitignore). If it was not saved anywhere, the answer tells the person where to put it. The answer never leaves the key inside a source file.
