schema_version: "1.1"
name: test-truth
description: Tests are proved by breaking the code and watching them fail.
tags: [test-truth]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
  prompt: |
    I want to refactor slug.js next week. Add tests first so I know I did not break it. Use node's built-in test runner.
graders:
  - name: test-file-created
    type: file_exists
    path: "**/*.test.js"
  - name: saw-a-test-fail
    type: regex
    target: trace
    pattern: '(ℹ|#) fail [1-9]'
  - name: asserts-outputs
    type: llm
    focus: trace
    criteria: |
      The tests the agent wrote assert exact output strings for concrete inputs, including accented letters, repeated separators or punctuation, and leading or trailing spaces. Tests that only check the function returns a string do not count.
